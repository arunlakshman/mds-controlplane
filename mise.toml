# Host tools for `make build` / the pre-commit hook.
# Bootstrap: install https://mise.jdx.dev then run  mise install
# (installs go, golangci-lint, buf; postinstall runs make install-hooks).
# make it-postgres needs Docker (Docker Desktop or Engine) on the host; mise cannot install it. It runs the pinned image postgres:17.11-alpine, see POSTGRES_IMAGE in the Makefile.

[tools]
go = "1.26.10"
golangci-lint = "2.15.0"
buf = "1.47.2"

[hooks]
postinstall = "make install-hooks"
